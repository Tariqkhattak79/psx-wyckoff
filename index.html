<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<title>PSX Wyckoff</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1e;color:#e6edf3;font-family:-apple-system,system-ui,sans-serif;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:#7d8590;font-size:13px;margin-bottom:16px}
.card{background:#121a2e;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid #7d8590}
.card.C{border-left-color:#3fb950}
.card.D{border-left-color:#58a6ff}
.card.B{border-left-color:#d29922}
.card.A{border-left-color:#7d8590}
.card.E{border-left-color:#f85149}
.row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sym{font-size:16px;font-weight:600}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;background:#21262d}
.badge.C{background:#1a3a1f;color:#3fb950}
.badge.D{background:#1a2a4a;color:#58a6ff}
.badge.B{background:#3a2f0f;color:#d29922}
.badge.A{background:#2a2a2a;color:#7d8590}
.badge.E{background:#3a1a1a;color:#f85149}
.action{font-size:13px;color:#c9d1d9;margin-bottom:8px}
.levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;margin-top:6px}
.lvl{background:#0a0f1e;padding:6px;border-radius:6px;text-align:center}
.lvl .lbl{color:#7d8590;font-size:10px;text-transform:uppercase}
.lvl .val{color:#e6edf3;font-weight:600;font-size:13px}
.reason{font-size:11px;color:#7d8590;margin-top:8px;font-style:italic}
.empty{text-align:center;padding:40px 20px;color:#7d8590}
</style>
</head>
<body>
<h1>PSX Wyckoff</h1>
<div class="sub" id="date">loading...</div>
<div id="list"></div>
<script>
const URL="https://lmuwpfejzzfsagkjddui.supabase.co/rest/v1/wyckoff_signals";
const KEY="sb_publishable_qa_DZT1u5UyeGKA3U_UG2A_1Xg1rC34";
async function load(){
  const r=await fetch(URL+"?select=*",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
  const d=await r.json();
  const order={C:0,D:1,B:2,A:3,E:4};
  d.sort((a,b)=>order[a.stage]-order[b.stage]);
  document.getElementById("date").textContent="Run date: "+(d[0]?d[0].run_date:"no data");
  const L=document.getElementById("list");
  if(!d.length){L.innerHTML="<div class='empty'>No signals yet</div>";return}
  let h="";
  for(const s of d){
    h+="<div class='card "+s.stage+"'>";
    h+="<div class='row1'><div class='sym'>"+s.symbol+"</div><div class='badge "+s.stage+"'>"+s.stage+"</div></div>";
    h+="<div class='action'>"+s.action+"</div>";
    if(s.entry){
      h+="<div class='levels'>";
      h+="<div class='lvl'><div class='lbl'>Entry</div><div class='val'>"+s.entry+"</div></div>";
      h+="<div class='lvl'><div class='lbl'>Stop</div><div class='val'>"+s.stop+"</div></div>";
      h+="<div class='lvl'><div class='lbl'>Target</div><div class='val'>"+s.target+"</div></div>";
      h+="</div>";
    }
    h+="<div class='reason'>"+s.reason+"</div>";
    h+="</div>";
  }
  L.innerHTML=h;
}
load();
</script>
</body>
</html>
