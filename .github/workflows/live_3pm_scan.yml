name: 3PM PSX Exhaustion Scan

on:
  schedule:
    # 10:00 AM UTC is exactly 3:00 PM Pakistan Time
    - cron: '0 10 * * 1-5' 
  workflow_dispatch: 

jobs:
  live-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pandas psxdata
          
      - name: Run PSX Script
        run: python live_3pm_scan.py
        
      - name: Commit and Push updated JSON
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add live_scan.json
          git commit -m "Updated live scan results [skip ci]" || echo "No changes to commit"
          git push
