name: 3PM Exhaustion Scan

on:
  schedule:
    - cron: '0 10 * * 1-5' # 3:00 PM PKT
  workflow_dispatch:

jobs:
  live-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pypsx-toolkit pandas
          
      - name: Fetch Data (3PM Live)
        run: python fetch_data.py
        
      - name: Run Exhaustion Scanner
        run: python live_scanner.py
        
      - name: Commit and Push updated JSON
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add -f live_scan.json
          git commit -m "Updated 3PM scan [skip ci]" || echo "No changes to commit"
          git push
