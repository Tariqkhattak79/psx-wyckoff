name: 3PM Live Exhaustion Scan

on:
  schedule:
    - cron: '0 10 * * 1-5' # Runs at 10:00 UTC = 3:00 PM Pakistan Time
  workflow_dispatch: # Creates the manual "Run workflow" button

jobs:
  live-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to save the JSON file back to GitHub
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pandas psxdata
          
      - name: Run 3PM Live Script
        run: python live_3pm_scan.py
        
      - name: Commit and Push updated JSON
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add live_scan.json
          git commit -m "Updated live scan results [skip ci]" || echo "No changes to commit"
          git push
