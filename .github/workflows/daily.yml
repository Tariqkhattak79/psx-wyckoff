name: Daily Master Run

on:
  schedule:
    - cron: "30 12 * * 1-5" # 5:30 PM PKT
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pypsx-toolkit pandas requests python-dotenv resend

      - name: Fetch data
        run: python fetch_data.py

      - name: Quality check
        run: python check_quality.py

      - name: Classify Wyckoff
        run: python classify.py

      - name: Day trade setups
        run: python daytrade.py

      - name: Run Exhaustion Scanner
        run: python live_scanner.py

      - name: Push Wyckoff to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python push_signals.py

      - name: Push Daytrade to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python push_daytrade.py

      - name: Send daily email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_email.py

      - name: Commit and Push updated JSONs
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add signals.json daytrade.json live_scan.json
          git commit -m "Updated all scan results [skip ci]" || echo "No changes to commit"
          git push
