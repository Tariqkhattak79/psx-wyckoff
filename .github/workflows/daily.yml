name: Daily Wyckoff Run

on:
  schedule:
    - cron: "30 12 * * 1-5"
    - cron: "30 4 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psxdata pandas requests python-dotenv resend

      - name: Fetch data
        run: python fetch_data.py

      - name: Quality check
        run: python check_quality.py

      - name: Classify Wyckoff
        run: python classify.py

      - name: Day trade setups
        run: python daytrade.py

      - name: Push Wyckoff to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python push_signals.py

      - name: Push Daytrade to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python push_daytrade.py

      - name: Send daily email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_email.py
